<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Trial Sender</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div class="card">
        <img class="logo" src="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2023.ico" alt="Netflix" />
        <h1>Netflix Trial Sender</h1>
        <p class="subtext">Send a 30-day trial signup to your email</p>

        <form id="trial-form">
            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
                autocomplete="off"
            />
            <button type="submit" id="submit-btn" class="submit-btn">Send Trial</button>
        </form>

        <div id="alert" class="alert hidden"></div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
